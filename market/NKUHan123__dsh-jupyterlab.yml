name: NKUHan123/dsh-jupyterlab
category: ui
tarball: https://github.com/NKUHan123/dsh-jupyterlab/releases/latest/download/dsh-jupyterlab.tgz
description:
  en: 'JupyterLab-style notebook for DSH: a left file bar of saved notebooks, code and output side by side with a draggable divider, outputs that stick to the viewport while a long cell scrolls, Jupyter keyboard shortcuts (a/b/dd, m/y, Shift+Enter vs Ctrl+Enter), a scissors button to delete a cell, a chip to switch it between code and Markdown, and a right-hand figure viewer that also previews saved images (TIFF converted to PNG). Modified fork of @beihaizb/dsh-notebook.'
  zh: 'DSH 的 JupyterLab 风格 notebook：左侧文件栏列出已保存的 ipynb，代码与输出左右分栏并可拖动，长 cell 滚动时输出贴住视口，支持 Jupyter 快捷键（a/b/dd、m/y、Shift+Enter 与 Ctrl+Enter 区分）、左侧剪刀删除 cell、py/md 标签切换代码与 Markdown，右侧看图面板还能预览磁盘上的图片（TIFF 自动转 PNG）。基于 @beihaizb/dsh-notebook 的修改版。'
